name: Publish

on:
  workflow_dispatch:
    inputs:
      curseforge:
        description: Publish to CurseForge
        required: true
        default: true
        type: boolean
      modrinth:
        description: Publish to Modrinth
        required: true
        default: true
        type: boolean
      release_type:
        description: Release type
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - alpha
      projects:
        description: Gradle projects to publish (comma-separated). Leave blank for all.
        required: false
        type: string
      dry_run:
        description: Dry run (prepare files and a report without uploading)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate destinations
        env:
          PUBLISH_CURSEFORGE: ${{ inputs.curseforge }}
          PUBLISH_MODRINTH: ${{ inputs.modrinth }}
        run: |
          case "$PUBLISH_CURSEFORGE:$PUBLISH_MODRINTH" in
            true:true) PUBLISH_DESTINATION=both ;;
            true:false) PUBLISH_DESTINATION=curseforge ;;
            false:true) PUBLISH_DESTINATION=modrinth ;;
            *)
              echo "::error::Select at least one destination: CurseForge or Modrinth."
              exit 1
              ;;
          esac
          echo "PUBLISH_DESTINATION=$PUBLISH_DESTINATION" >> "$GITHUB_ENV"

      - name: Validate selected GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Select a release tag in the 'Use workflow from' picker."
            exit 1
          fi
          if ! gh release view "$PUBLISH_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "::error::GitHub Release '$PUBLISH_TAG' was not found."
            exit 1
          fi
          echo "PUBLISH_TAG=$PUBLISH_TAG" >> "$GITHUB_ENV"
          echo "Publishing GitHub Release: $PUBLISH_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PUBLISH_RELEASE_TYPE: ${{ inputs.release_type }}
          PUBLISH_PROJECTS: ${{ inputs.projects }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          chmod u+x ./gradlew
          publish_args=(
            "-PpublishGitHubRepository=$GITHUB_REPOSITORY"
            "-PpublishTag=$PUBLISH_TAG"
            "-PpublishDestination=$PUBLISH_DESTINATION"
            "-PpublishReleaseType=$PUBLISH_RELEASE_TYPE"
            "-PpublishDryRun=$PUBLISH_DRY_RUN"
          )
          if [[ -n "$PUBLISH_PROJECTS" ]]; then
            publish_args+=("-PpublishProjects=$PUBLISH_PROJECTS")
          fi
          ./gradlew --no-daemon --continue publishMods "${publish_args[@]}"

      - name: Upload dry-run report
        if: ${{ !cancelled() && inputs.dry_run && hashFiles('build/publishMods/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-dry-run-${{ env.PUBLISH_TAG }}
          path: build/publishMods/
          if-no-files-found: error
